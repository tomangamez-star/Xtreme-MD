name: Build Xtreme Stickers APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Test and build preview
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Xtreme-Stickers-preview-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Build signed release when signing secrets are configured
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.XTREME_KEYSTORE_BASE64 }}
          XTREME_STORE_PASSWORD: ${{ secrets.XTREME_STORE_PASSWORD }}
          XTREME_KEY_ALIAS: ${{ secrets.XTREME_KEY_ALIAS }}
          XTREME_KEY_PASSWORD: ${{ secrets.XTREME_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Signing secrets are not configured; preview APK only.'
            exit 0
          fi
          export XTREME_KEYSTORE="$RUNNER_TEMP/xtreme-release.jks"
          trap 'rm -f "$XTREME_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$XTREME_KEYSTORE"
          chmod 600 "$XTREME_KEYSTORE"
          gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Xtreme-Stickers-signed-release-APK
          path: android/app/build/outputs/apk/release/*release.apk
          if-no-files-found: ignore
