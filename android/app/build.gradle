plugins { id 'com.android.application' }
android {
    namespace 'com.xtreme.stickers'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.xtreme.stickers'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('XTREME_KEYSTORE')) {
                storeFile file(System.getenv('XTREME_KEYSTORE'))
                storePassword System.getenv('XTREME_STORE_PASSWORD')
                keyAlias System.getenv('XTREME_KEY_ALIAS')
                keyPassword System.getenv('XTREME_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.airbnb.android:lottie:6.6.6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
